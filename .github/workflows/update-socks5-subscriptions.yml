name: Update SOCKS5 Subscriptions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate subscription files
        run: ./scripts/update_subscriptions.sh

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/update_subscriptions.sh subscriptions .github/workflows/update-socks5-subscriptions.yml
          git commit -m "Update SOCKS5 subscriptions"
          git push
